version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tablz-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: tablz
      POSTGRES_USER: tablz_app
      POSTGRES_PASSWORD: dev-password-changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablz_app -d tablz"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tablz-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
